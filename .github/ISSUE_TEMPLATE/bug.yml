name: 🐛 Bug report
description: Something is broken or behaves incorrectly.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. The more specific, the easier to fix.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect? What did you see instead?
      placeholder: "I clicked the Daily tile and the game started without showing the prize..."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open https://amsanghi.github.io/gops
        2. Click "Daily challenge"
        3. ...
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser & OS
      placeholder: "Chrome 142 on macOS 26"
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where?
      options:
        - On amsanghi.github.io/gops (production)
        - Locally
        - Both
    validations:
      required: true
  - type: textarea
    id: console
    attributes:
      label: Console errors (if any)
      description: Open DevTools → Console and paste any red errors.
      render: shell
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots, screen recordings, related issues.
